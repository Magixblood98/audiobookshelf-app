name: Build APK

on:
  push:
    paths-ignore:
      - 'ios/**'
      - 'readme.md'
  pull_request:
    paths-ignore:
      - 'ios/**'
      - 'readme.md'
jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - name: checkout sources
        uses: actions/checkout@v3

      - name: use Node.js 20.x
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v2
        with:
          distribution: 'temurin'
          java-version: 21

      - name: install dependencies
        run: npm ci --omit=optional

      - name: build Nuxt project
        run: npm run generate

      - name: copy to Android project
        run: npx cap sync

      - name: set up the permanent signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ABS_SERIES_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "No signing key secret, using the default debug key"; exit 0; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/abs-series.p12"
          echo "ABS_SERIES_KEYSTORE=$RUNNER_TEMP/abs-series.p12" >> "$GITHUB_ENV"

      - name: build Android app
        env:
          ABS_SERIES_KEYSTORE_PASSWORD: ${{ secrets.ABS_SERIES_KEYSTORE_PASSWORD }}
        run: ./android/gradlew assembleDebug -p android --no-daemon

      - name: check the APK signature
        if: ${{ env.ABS_SERIES_KEYSTORE != '' }}
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -n 1)
          "$apksigner" verify --verbose --print-certs android/app/build/outputs/apk/debug/app-debug.apk

      - name: rename apk
        working-directory: android/app/build/outputs/apk/debug/
        run: |
          build="$(date +%Y%m%d-%H%M%S)-$(git rev-parse --short HEAD)"
          name="audiobookshelf-${build}.apk"
          mv -v app-debug.apk "${name}"

      - name: upload app
        uses: actions/upload-artifact@v4
        with:
          name: audiobookshelf-apk
          path: android/app/build/outputs/apk/debug/*.apk
